name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses & install NDK
        run: |
          SDKMANAGER=$(ls -d "${ANDROID_HOME}/cmdline-tools/"*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platform-tools" "build-tools;37.0.0" "ndk;27.1.12297006"
          PLATFORM_PKG=$("${SDKMANAGER}" --list 2>/dev/null | grep -oE 'platforms;android-37[^ ]*' | head -n 1 || true)
          if [ -n "${PLATFORM_PKG}" ]; then
            echo "Installing ${PLATFORM_PKG}"
            "${SDKMANAGER}" "${PLATFORM_PKG}"
          fi

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Type-check TypeScript
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Build Android Release APK (arm64-v8a)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload Undercooked APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: undercooked-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
